<circle cx="350" cy="95" r="6" fill="#d62728"/>
<text x="365" y="88" font-family="Arial" font-size="18">ES</text>
<g stroke="black" stroke-width="2">
  <line x1="140" y1="430" x2="140" y2="395"/>
  <line x1="175" y1="430" x2="175" y2="395"/>
  <line x1="220" y1="430" x2="220" y2="395"/>
  <line x1="255" y1="430" x2="255" y2="395"/>
  <line x1="290" y1="430" x2="290" y2="395"/>
  <line x1="345" y1="430" x2="345" y2="395"/>
  <line x1="380" y1="430" x2="380" y2="395"/>
  <line x1="610" y1="430" x2="610" y2="395"/>
  <line x1="690" y1="430" x2="690" y2="395"/>
</g>
<text x="620" y="165" font-family="Arial" font-size="18">Pathway members concentrated near the top</text>
<text x="620" y="195" font-family="Arial" font-size="18">produce a large positive enrichment score</text>
</svg>